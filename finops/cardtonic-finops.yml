specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Cardtonic
providerId: cardtonic
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Fintech
  - Gift Cards
  - Payments
  - Africa
description: 'FOCUS-aligned FinOps for Cardtonic: per-transaction take rates on gift cards, bill payments,
  eSIMs, and virtual dollar cards; merchant API access via waitlist with bilateral pricing.'
notes: Cardtonic does not publish public API or transaction tariffs. Take rates are quoted in-app at
  point of sale; reconcile against merchant-onboarding terms when available.
sources:
  - https://www.cardtonic.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Cardtonic Limited
serviceCategory: Fintech / Gift Cards
billingModel:
  pricingCategory: Take Rate + Custom Merchant Agreement
  billingFrequency: Continuous Settlement
  billingCurrency: NGN / GHS / USD
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Cardtonic
  ServiceCategory: Fintech / Gift Cards
  ProviderName: Cardtonic
  PublisherName: Cardtonic Limited
  InvoiceIssuerName: Cardtonic Limited
  BillingCurrency: NGN
meters:
  - name: gift_card_transactions
    unit: transaction
    aggregation: sum
    dimensions:
      - direction
      - card_brand
      - country
  - name: bill_payments
    unit: transaction
    aggregation: sum
    dimensions:
      - biller
      - country
  - name: virtual_card_issuance
    unit: card
    aggregation: sum
    dimensions:
      - currency
  - name: esim_purchases
    unit: purchase
    aggregation: sum
    dimensions:
      - country
principles:
  - name: Visibility
    description: Visibility into per-transaction take rates is via the in-app quote and merchant settlement
      reports; the consumer app displays NGN/GHS settlement.
  - name: Allocation
    description: Allocate by merchant, country, and product family (gift cards vs bills vs eSIMs).
  - name: Optimization
    description: Bulk gift-card ordering and merchant-tier negotiation reduce effective take rates; cache
      catalog data to avoid redundant inventory calls.
  - name: Accountability
    description: Merchant operations team owns the relationship; reconcile NGN/GHS settlement against
      USD card economics monthly.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
