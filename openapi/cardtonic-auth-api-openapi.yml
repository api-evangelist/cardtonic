openapi: 3.2.0
info:
  title: Cardtonic Auth API
servers:
- url: https://api.cardtonic.com/v1
  description: Prod Env
tags:
- name: Auth
paths:
  /auth/signup/business:
    post:
      summary: SIGN UP BUSINESS USER
      deprecated: false
      description: ''
      tags:
      - Auth
      parameters:
      - name: X-Tonic-Env
        in: header
        description: ''
        required: true
        example: development
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                password:
                  type: string
                phoneNumber:
                  type: string
                username:
                  type: string
                email:
                  type: string
                country:
                  type: string
                business:
                  type: object
                  properties:
                    name:
                      type: string
                    website:
                      type: string
                    description:
                      type: string
                  required:
                  - name
                  - website
                  - description
                  x-apidog-orders:
                  - name
                  - website
                  - description
              required:
              - name
              - password
              - phoneNumber
              - username
              - email
              - country
              - business
              x-apidog-orders:
              - name
              - password
              - phoneNumber
              - username
              - email
              - country
              - business
            example:
              name: Akinbiyi Fatunmbi
              password: Computer7,
              phoneNumber: '+2347038784406'
              username: akinpiers
              email: akinbiyi@thetonictech.com
              country: Nigeria
              business:
                name: Akinpiers's Business
                website: https://thetonictech.com
                description: About this business
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                      phoneNumber:
                        type: string
                      username:
                        type: string
                      business:
                        type: object
                        properties:
                          name:
                            type: string
                          website:
                            type: string
                          description:
                            type: string
                        required:
                        - name
                        - website
                        - description
                        x-apidog-orders:
                        - name
                        - website
                        - description
                    required:
                    - name
                    - email
                    - phoneNumber
                    - username
                    - business
                    x-apidog-orders:
                    - name
                    - email
                    - phoneNumber
                    - username
                    - business
                  meta:
                    type: object
                    properties:
                      settings:
                        type: object
                        properties: {}
                        x-apidog-orders: []
                    required:
                    - settings
                    x-apidog-orders:
                    - settings
                required:
                - message
                - success
                - data
                - meta
                x-apidog-orders:
                - message
                - success
                - data
                - meta
              example:
                message: data fetched
                success: true
                data:
                  name: Michael George
                  email: george@thetonictech.com
                  phoneNumber: '2348000000000'
                  username: michaelgeorge_1730672802298
                  business:
                    name: Mikkycody's Business
                    website: https://thetonictech.com
                    description: About this business
                meta:
                  settings: {}
          headers: {}
          x-apidog-name: 201 SIGN UP BUSINESS USER
        '422':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  meta:
                    type: object
                    properties:
                      settings:
                        type: object
                        properties: {}
                        x-apidog-orders: []
                    required:
                    - settings
                    x-apidog-orders:
                    - settings
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        field:
                          type: string
                        location:
                          type: string
                      required:
                      - message
                      - field
                      - location
                      x-apidog-orders:
                      - message
                      - field
                      - location
                required:
                - success
                - message
                - meta
                - errors
                x-apidog-orders:
                - success
                - message
                - meta
                - errors
              example:
                success: false
                message: validation errors
                meta:
                  settings: {}
                errors:
                - message: password must contain 8 characters and at least 1 number, 1 uppercase, and 1 lowercase letter
                  field: password
                  location: body
                - message: phone number must be correct nigerian number
                  field: phoneNumber
                  location: body
                - message: name cannot be empty
                  field: name
                  location: body
                - message: business must be an object
                  field: business
                  location: body
                - message: business object cannot be empty
                  field: business
                  location: body
                - message: Business must be an object
                  field: business
                  location: body
                - message: must be valid email
                  field: email
                  location: body
                - message: must be valid email
                  field: email
                  location: body
          headers: {}
          x-apidog-name: 422 SIGN UP BUSINESS USER
      security: []
      x-apidog-folder: Auth
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/737471/apis/api-11716510-run
      operationId: postAuthSignupBusiness
      x-operation-id-source: derived
