                        field:
                          type: string
                        location:
                          type: string
                      required:
                      - message
                      - field
                      - location
                      x-apidog-orders:
                      - message
                      - field
                      - location
                required:
                - success
                - message
                - meta
                - errors
                x-apidog-orders:
                - success
                - message
                - meta
                - errors
              example:
                success: false
                message: validation errors
                meta:
                  settings: {}
                errors:
                - message: provide the token
                  field: token
                  location: body
                - message: provide the otp
                  field: otp
                  location: body
          headers: {}
          x-apidog-name: 422 VERIFY EMAIL
      security: []
      x-apidog-folder: Auth
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/737471/apis/api-11716511-run
