description: Cardtonic is an Africa-focused gift-card and fintech platform. Its Gift Card Developer API
  is currently waitlist-only and has no published pricing. Consumer-facing services (gift card trading,
  virtual dollar cards, bill payments, eSIMs) carry per-transaction take rates that are quoted at the
  point of sale rather than as a public tariff sheet.
notes: >-
  Re-searched 2026-09-05 and re-confirmed: Cardtonic publishes no developer pricing of any kind.
  https://cardtonic.com/pricing returns 404; https://cardtonic.com/developer carries feature copy
  and a Notion waitlist link (https://thetonictech.notion.site/18807c8de3018052a505f9eb67411054)
  but no tier, rate, quota or overage; the API documentation at https://docs.cardtonic.com is
  purely technical and mentions no commercial terms. plan_count is 1 only because the waitlist
  merchant agreement is a real, named route to access - it is not a published tariff.
plan_count: 1
sources:
  - url: https://cardtonic.com/developer
    status: 200
    note: waitlist + feature copy, no pricing
  - url: https://cardtonic.com/pricing
    status: 404
  - url: https://docs.cardtonic.com
    status: 200
    note: 14 operations, no commercial terms
  - url: https://www.cardtonic.com/
    status: 200
plans:
  - id: cardtonic-developer-waitlist
    name: Gift Card Developer API (Waitlist)
    type: enterprise
    description: Merchant-facing API for embedding gift card purchase, sale, bulk ordering, inventory,
      and redemption. Currently waitlist-only; pricing is set at onboarding.
    entries:
      - label: Merchant agreement
        name: merchant_agreement
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: NG / GH / global
        unit: 1
        price: contact business
        userMultiplied: false
    elements:
      - name: Cardtonic Gift Card Developer API
      - name: Bulk Gift Card Ordering
      - name: Inventory and Redemption
