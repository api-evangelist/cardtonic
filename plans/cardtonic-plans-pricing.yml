description: Cardtonic is an Africa-focused gift-card and fintech platform. Its Gift Card Developer API
  is currently waitlist-only and has no published pricing. Consumer-facing services (gift card trading,
  virtual dollar cards, bill payments, eSIMs) carry per-transaction take rates that are quoted at the
  point of sale rather than as a public tariff sheet.
notes: No public API pricing page found. Gift Card Developer API is waitlist-only; rates are negotiated
  during onboarding. Reconcile when Cardtonic publishes a developer pricing page.
