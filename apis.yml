name: Cardtonic
description: >-
  Cardtonic is an Africa-focused fintech platform, operated by The Tonic
  Technologies, that lets users trade gift cards (sell unused cards for cash and
  buy over 14,000 local and international gift cards), issue virtual dollar
  cards, pay bills (airtime, data, electricity, TV, betting), purchase eSIMs in
  140+ countries, and shop for gadgets through its Just Gadgets storefront.
  Cardtonic supports Naira and Cedi settlement for users in Nigeria and Ghana,
  carries a PCI DSS certification badge, and is registered with the Nigeria Data
  Protection Commission (NDPC) as a Data Controller of Major Importance under the
  Nigeria Data Protection Act 2023. For businesses, Cardtonic advertises a Gift
  Card Developer API (waitlist-only, no published contract) and separately
  publishes a real OpenAPI 3.0.1 contract for its Business API - business signup,
  login, 2FA, BVN and corporate KYC, and API-key issuance - through an
  Apidog-hosted documentation site at docs.cardtonic.com, against the base
  https://api.cardtonic.com/v1.
